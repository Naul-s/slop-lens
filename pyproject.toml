[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slop-lens"
version = "0.4.0"
description = "Reference tool that explains why AI-made websites and games may feel like AI slop and suggests fixes — not an authoritative detector (MCP server + CLI + Agent Skill)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["ai-slop", "mcp", "design-review", "game-feel", "agents"]

[project.urls]
Homepage = "https://github.com/Naul-s/slop-lens"
Issues = "https://github.com/Naul-s/slop-lens/issues"

[project.scripts]
slop-lens = "slop_lens.cli:main"
slop-lens-mcp = "slop_lens.mcp_server:serve"

[tool.setuptools.packages.find]
include = ["slop_lens*"]
