<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>야간 택배: 마지막 한 집</title>
  <meta name="description" content="비 오는 골목에서 우산 하나로 택배 상자를 지켜 마지막 집까지 배달하는 30초 게임">
  <meta property="og:image" content="https://example.org/og-delivery.png">
  <link rel="icon" href="icon.svg">
  <style>
    :root { --night: #1b1a2e; --lamp: #f2c14e; --rain: #7f8cb0; --paper: #efe6d2; }
    html, body { margin: 0; height: 100%; background: var(--night); }
    canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="cv" aria-label="게임 화면"></canvas>
  <script type="module">
    const W = 320, H = 180;
    const P = { night: '#1b1a2e', wall: '#2c2a45', lamp: '#f2c14e', rain: '#7f8cb0', box: '#c98b4a', hurt: '#e4572e', ui: '#efe6d2' };
    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    function fit() {
      const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
      const d = devicePixelRatio || 1;
      cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
      cv.width = W * s * d; cv.height = H * s * d;
      ctx.setTransform(s * d, 0, 0, s * d, 0, 0); ctx.imageSmoothingEnabled = false;
    }
    addEventListener('resize', fit); fit();

    const sprites = new Image(); sprites.src = 'sprites/courier-16.png';
    await document.fonts.load('8px "Galmuri11"');
    const sfx = { drip: new Audio('sfx/drip.wav'), splash: new Audio('sfx/splash.wav'), ding: new Audio('sfx/ding.wav') };
    const play = (a, rate = 1) => { const c = a.cloneNode(); c.playbackRate = rate; c.volume = settings.sfx; c.play(); };
    const settings = { sfx: 0.6, shake: true };

    // 난이도는 '빗줄기 밀도'로만 올린다: 적을 늘리면 우산 조작이 보이지 않게 됨
    const waves = [{ t: 0, density: 0.6 }, { t: 12, density: 1.1 }, { t: 22, density: 1.7 }, { t: 27, density: 0.4 }];
    const state = { mode: 'title', t: 0, dryness: 1, drops: [], particles: [], shake: 0, hitStop: 0, best: +localStorage.getItem('best') || 0 };
    const input = { left: false, right: false, open: false };
    addEventListener('keydown', e => { if (e.key === 'ArrowLeft') input.left = true; if (e.key === 'ArrowRight') input.right = true; if (e.key === ' ') input.open = true; if (e.key === 'p' || e.key === 'Escape') togglePause(); });
    addEventListener('keyup', e => { if (e.key === 'ArrowLeft') input.left = false; if (e.key === 'ArrowRight') input.right = false; if (e.key === ' ') input.open = false; });
    addEventListener('pointerdown', e => { input.open = true; if (state.mode !== 'play') start(); });
    addEventListener('pointerup', () => input.open = false);
    document.addEventListener('visibilitychange', () => document.hidden && state.mode === 'play' && togglePause());

    const hero = { x: 40, vx: 0, tilt: 0 };
    function start() { Object.assign(state, { mode: 'play', t: 0, dryness: 1, drops: [], particles: [] }); hero.x = 40; }
    function togglePause() { state.mode = state.mode === 'paused' ? 'play' : state.mode === 'play' ? 'paused' : state.mode; }
    const lerp = (a, b, k) => a + (b - a) * k;

    function update(dt) {
      if (state.mode !== 'play') return;
      if (state.hitStop > 0) { state.hitStop -= dt; return; }
      state.t += dt;
      const wave = waves.filter(w => w.t <= state.t).pop();
      const target = (input.right - input.left) * 70;
      hero.vx = lerp(hero.vx, target, 1 - Math.exp(-dt * 10));
      hero.x += hero.vx * dt; hero.tilt = lerp(hero.tilt, hero.vx / 70, dt * 8);
      if (Math.random() < wave.density * dt * 30) state.drops.push({ x: hero.x + (Math.random() * 120 - 30), y: -4, vy: 160 + Math.random() * 40 });
      for (const d of state.drops) d.y += d.vy * dt;
      for (const d of state.drops) if (!d.dead && d.y > 140 && Math.abs(d.x - hero.x) < 10) {
        d.dead = true;
        if (input.open) { play(sfx.drip, 0.95 + Math.random() * 0.1); burst(d.x, 132, P.rain, 4); }
        else { state.dryness -= 0.08; state.hitStop = 0.04; state.shake = 3; play(sfx.splash); burst(d.x, 140, P.hurt, 8); }
      }
      state.drops = state.drops.filter(d => !d.dead && d.y < H);
      for (const p of state.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
      state.particles = state.particles.filter(p => p.life > 0);
      if (state.dryness <= 0) { state.mode = 'over'; }
      if (hero.x > 300) { state.mode = 'delivered'; play(sfx.ding); state.best = Math.max(state.best, Math.round(state.dryness * 100)); localStorage.setItem('best', state.best); }
    }
    function burst(x, y, color, n) { for (let i = 0; i < n; i++) state.particles.push({ x, y, vx: Math.random() * 80 - 40, vy: -Math.random() * 90, life: 0.4, color }); }

    function render() {
      ctx.save();
      if (settings.shake && state.shake > 0.1) { ctx.translate((Math.random() - .5) * state.shake, (Math.random() - .5) * state.shake); state.shake *= 0.85; }
      ctx.fillStyle = P.night; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(sprites, 0, 0, 16, 16, hero.x - 8, 136, 16, 16);
      for (const p of state.particles) { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 1, 1); }
      ctx.restore();
      ctx.fillStyle = P.ui; ctx.font = '8px "Galmuri11"';
      ctx.fillText(`상자 보송함 ${Math.round(state.dryness * 100)}%`, 6, 12);
      if (state.mode === 'title') ctx.fillText('스페이스(또는 터치)를 누르고 있으면 우산이 펴져요', 40, 90);
      if (state.mode === 'paused') ctx.fillText('잠깐 쉬는 중 — P로 계속', 110, 90);
      if (state.mode === 'over') ctx.fillText('상자가 젖었어요. 다시? (스페이스)', 90, 90);
      if (state.mode === 'delivered') ctx.fillText(`배달 완료! 최고 기록 ${state.best}%`, 100, 90);
    }

    let last = performance.now(), acc = 0; const STEP = 1 / 60;
    function frame(now) {
      acc += Math.min(0.25, (now - last) / 1000); last = now;
      while (acc >= STEP) { update(STEP); acc -= STEP; }
      render(); requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
